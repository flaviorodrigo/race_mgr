# Adds the game server to the Race Manager image at build time (instead of ./docker/download-server.sh).
#   ./docker/build-with-server.sh <steam-username>
# or by hand:
#   STEAM_USERNAME=... STEAM_PASSWORD=... [STEAM_GUARD_CODE=...] \
#     docker compose -f docker-compose.yml -f docker/docker-compose.with-server.yml up -d --build
# The images this makes contain Reiza's game server files: keep them local, never push them to a registry.
services:
  racemgr:
    build:
      target: with-server
      args:
        STEAM_USERNAME: ${STEAM_USERNAME:?set STEAM_USERNAME}
      secrets: [steam_password, steam_guard_code]
    environment:
      # Set to true for one start after rebuilding, to replace the game files with the newer ones in the image
      RM_REFRESH_SERVER: ${RM_REFRESH_SERVER:-false}

secrets:
  steam_password:
    environment: STEAM_PASSWORD
  steam_guard_code:
    environment: STEAM_GUARD_CODE
