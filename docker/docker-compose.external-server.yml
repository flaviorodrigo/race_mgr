# Race Manager next to an AMS2 dedicated server that you already run in its own container (e.g. on a NAS).
# Race Manager does NOT start, stop or restart that server: after changing the rotation, restart it yourself.
#
#   cp .env.example .env            # fill it in (AMS2_DATA_DIR, RACEMGR_IMAGE, ...)
#   docker compose -f docker/docker-compose.external-server.yml --env-file .env up -d
# It pulls the published image named by RACEMGR_IMAGE (e.g. ghcr.io/<owner>/race_mgr-external:v1.0.0), so this
# file works on its own, e.g. copied to a NAS. To build the image from this repository instead, add
# -f docker/docker-compose.external-build.yml (and --build).
#
# Assumes the game server container uses host networking, so its HTTP API (port 9000) is on the host.
# Race Manager shares the host network too, so it reaches the API on 127.0.0.1, where the game server
# treats it as a local admin (its default "admin" access filter) and no password is needed.
# Keep httpApiInterface "127.0.0.1" in the game server's server.cfg so the API isn't open to the LAN.
#
# Exposure: Race Manager listens on 127.0.0.1:8080 of the host only. Put your NAS reverse proxy (HTTPS) in
# front of it. MongoDB is published on 127.0.0.1 only.
services:
  racemgr:
    image: ${RACEMGR_IMAGE:?set RACEMGR_IMAGE in .env, e.g. ghcr.io/<owner>/race_mgr-external:v1.0.0}
    restart: unless-stopped
    network_mode: host
    # Run as the owner of the game server's folder so Race Manager can write server.cfg and the rotation file there
    user: "${RACEMGR_UID:-1000}:${RACEMGR_GID:-1000}"
    environment:
      RM_ADMIN_USER: ${RM_ADMIN_USER:?set in .env}
      RM_ADMIN_PASSWORD: ${RM_ADMIN_PASSWORD:?set in .env}
      RM_JWT_SECRET: ${RM_JWT_SECRET:?set in .env}
      RM_MONGO_HOST: 127.0.0.1
      RM_MONGO_PORT: "27017"
      RM_MONGO_USER: ${RM_MONGO_USER:?set in .env}
      RM_MONGO_PASS: ${RM_MONGO_PASS:?set in .env}
      # Race Manager shares the host's network, so this port must be free there (change it if something else uses 8080)
      RM_PORT: ${RM_PORT:-8080}
      RM_GAMESERVER_HOST: 127.0.0.1
      RM_GAMESERVER_PORT: "9000"
      # "signal" once the game server's container uses docker/game-server/entrypoint.sh: Race Manager can then restart
      # it (Race day > Restart game server) by writing a file into the shared folder
      RM_GAMESERVER_RESTART: ${RM_GAMESERVER_RESTART:-}
      # Only if the game server's API is NOT reached from 127.0.0.1: its HTTP basic auth user (see
      # httpApiUsers / httpApiGroups in server.cfg). Plain HTTP, so only on a trusted network.
      # RM_GAMESERVER_USER: admin
      # RM_GAMESERVER_PASSWORD: ${AMS2_API_PASSWORD}
      # Set to true when your HTTPS reverse proxy talks to Race Manager over plain HTTP
      RM_COOKIE_SECURE: ${RM_COOKIE_SECURE:-false}
      # Optional Discord notifications
      RM_DISCORD_WEBHOOK_URL: ${RM_DISCORD_WEBHOOK_URL:-}
      # Optional "Sign in with Synology" behind docker/docker-compose.sso-proxy.yml (see the README)
      RM_SSO_ISSUER: ${RM_SSO_ISSUER:-}
      RM_SSO_CLIENT_ID: ${RM_SSO_CLIENT_ID:-}
      RM_SSO_ADMINS: ${RM_SSO_ADMINS:-}
      RM_SSO_STEWARDS: ${RM_SSO_STEWARDS:-}
      RM_SSO_ADMIN_GROUPS: ${RM_SSO_ADMIN_GROUPS:-}
      RM_SSO_STEWARD_GROUPS: ${RM_SSO_STEWARD_GROUPS:-}
    # With Synology sign-in: if the NAS can't reach its own public name (no NAT loopback), send it straight to the NAS
    # extra_hosts:
    #   - "yourname.synology.me:192.168.1.10"
    volumes:
      # The game server's install folder: Race Manager reads lua_config/sms_stats_data.json and writes the
      # rotation files under lua/ and lua_config/. Set AMS2_DATA_DIR to where your server keeps them.
      - ${AMS2_DATA_DIR:?set in .env}:/data/ams2-server
      # If your server.cfg lives outside that folder and is mounted into the game server on its own, mount the same
      # file here too, so Race Manager reads and edits the one the game server uses (it is then written in place):
      # - /volume1/docker/ams2-server/server.cfg:/data/ams2-server/server.cfg
    depends_on:
      mongo:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mongo:
    image: mongo:7.0@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      RM_MONGO_USER: ${RM_MONGO_USER:?set in .env}
      RM_MONGO_PASS: ${RM_MONGO_PASS:?set in .env}
    ports:
      - "127.0.0.1:27017:27017"   # host-network Race Manager connects here; not reachable from the LAN
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Authenticates as the app user, so it only passes once the init script has created it
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$RM_MONGO_USER\" -p \"$$RM_MONGO_PASS\" --authenticationDatabase admin racemgr --eval \"db.runCommand({ping:1}).ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]

volumes:
  mongo-data:
