debug=false

# Bind to loopback by default. Set RM_BIND_ADDRESS (e.g. 0.0.0.0) only if you
# deliberately want other machines to reach Race Manager directly. Prefer a TLS
# reverse proxy that forwards only the public paths (see README).
server.address=${RM_BIND_ADDRESS:127.0.0.1}
server.port=${RM_PORT:8080}

# Never leak exception messages or stack traces in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

#spring.data.mongodb.uri=mongodb://localhost:27017/racemgr
spring.data.mongodb.uri=mongodb://${RM_MONGO_USER}:${RM_MONGO_PASS}@${RM_MONGO_HOST}:${RM_MONGO_PORT}/racemgr?authSource=admin
# Auto-index in Mongo off by default, needed for unique index enforcement
spring.data.mongodb.auto-index-creation=true
server.servlet.session.cookie.same-site=strict
spring.profiles.active=default
