name: Docker image

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build the image (and publish it on a version tag)
    runs-on: ubuntu-latest   # amd64, which the Wine base image needs
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # The plain image: Race Manager + Wine; the game server files are mounted when it runs
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: racemgr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The tools the image needs are there
        run: docker run --rm --entrypoint sh racemgr:ci -c 'java -version && wine --version && test -x /app/entrypoint.sh && test -x /app/seed-server.sh'

      - name: Without the game server files it says so and stops
        run: |
          set +e
          out="$(docker run --rm racemgr:ci 2>&1)"; code=$?
          echo "$out" | tail -3
          test "$code" -ne 0 && echo "$out" | grep -q "DedicatedServerCmd.exe not found"

      # The with-server target, with a few stand-in files instead of the Steam download (which needs a Steam login)
      - name: Stand-in game server files
        run: |
          mkdir -p ci-server/lua/sms_rotate ci-server/lua_config
          echo stand-in > ci-server/DedicatedServerCmd.exe
          echo '{}' > ci-server/lua/sms_rotate/sms_rotate_default_config.json
      - name: Build the with-server target
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: with-server
          build-contexts: ams2-files=./ci-server
          load: true
          tags: racemgr:ci-with-server
          cache-from: type=gha
      - name: The server files are copied in on first start, and a restart leaves them alone
        run: |
          docker run --rm -e RM_PATH_TO_DEDICATED_SERVER=/tmp/ams2 --entrypoint bash racemgr:ci-with-server -c '
            set -e
            /app/seed-server.sh
            test -f /tmp/ams2/DedicatedServerCmd.exe && test -f /tmp/ams2/server.cfg
            echo edited > /tmp/ams2/server.cfg
            /app/seed-server.sh
            test "$(cat /tmp/ams2/server.cfg)" = edited
            RM_REFRESH_SERVER=true /app/seed-server.sh
            test "$(cat /tmp/ams2/server.cfg)" = edited'

      # Only a version tag (v1.2.3) publishes. The image holds no game server files.
      - name: Sign in to GitHub's container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Publish the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
