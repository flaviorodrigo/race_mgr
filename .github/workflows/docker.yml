name: Docker image

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      real_download:
        description: Also build the with-server image with the real (anonymous) SteamCMD download. Nothing is published.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Build, test and publish the images for this commit
    # A version tag doesn't build: the release job names the images the commit's branch push already tested
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest   # amd64, which the Wine base image needs
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # The plain image: Race Manager + Wine; the game server files are mounted when it runs
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: racemgr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The tools the image needs are there
        run: docker run --rm --entrypoint sh racemgr:ci -c 'java -version && wine --version && test -x /app/entrypoint.sh && test -x /app/seed-server.sh'

      - name: Without the game server files it says so and stops
        run: |
          set +e
          out="$(docker run --rm racemgr:ci 2>&1)"; code=$?
          echo "$out" | tail -3
          test "$code" -ne 0 && echo "$out" | grep -q "DedicatedServerCmd.exe not found"

      # The with-server target, with a few stand-in files instead of the Steam download (which needs a Steam login)
      - name: Stand-in game server files
        run: |
          mkdir -p ci-server/lua/sms_rotate ci-server/lua_config
          echo stand-in > ci-server/DedicatedServerCmd.exe
          echo '{}' > ci-server/lua/sms_rotate/sms_rotate_default_config.json
      - name: Build the with-server target
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: with-server
          build-contexts: ams2-files=./ci-server
          load: true
          tags: racemgr:ci-with-server
          cache-from: type=gha
      - name: The server files are copied in on first start, and a restart leaves them alone
        run: |
          docker run --rm -e RM_PATH_TO_DEDICATED_SERVER=/tmp/ams2 --entrypoint bash racemgr:ci-with-server -c '
            set -e
            /app/seed-server.sh
            test -f /tmp/ams2/DedicatedServerCmd.exe && test -f /tmp/ams2/server.cfg
            echo edited > /tmp/ams2/server.cfg
            /app/seed-server.sh
            test "$(cat /tmp/ams2/server.cfg)" = edited
            RM_REFRESH_SERVER=true /app/seed-server.sh
            test "$(cat /tmp/ams2/server.cfg)" = edited'

      # The lightweight image for a game server that runs elsewhere (a NAS): Race Manager only, no Wine
      - name: Build the external-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.external
          platforms: linux/amd64
          load: true
          tags: racemgr-external:ci
          cache-from: type=gha,scope=external
          cache-to: type=gha,mode=max,scope=external
      - name: It has Java and the jar, and runs as a non-root user
        run: docker run --rm --entrypoint sh racemgr-external:ci -c 'java -version && test -f /app/racemgr.jar && test "$(id -u)" != 0'
      - name: The game server entrypoint restarts on Race Manager's signal
        run: docker/ci/game-server-entrypoint-test.sh
      - name: The NAS setup works (another user, a separately mounted server.cfg, a real MongoDB)
        run: docker/ci/nas-smoke.sh racemgr-external:ci

      # The tested images, exactly as built above, go to the registry under the commit (sha-1234567). A version
      # tag later just gives them a name (release job below): nothing is built twice. They hold no game server files.
      - name: Sign in to GitHub's container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images under the commit
        if: github.event_name == 'push'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="sha-${GITHUB_SHA::7}"
          docker tag racemgr:ci "$repo:$sha"
          docker tag racemgr-external:ci "$repo-external:$sha"
          docker push -q "$repo:$sha"
          docker push -q "$repo-external:$sha"
          echo "Published $repo:$sha and $repo-external:$sha"

  release:
    name: Name the tested images after the version tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The branch push of this commit builds, tests and publishes sha-<commit>; wait for it if it is still running
      - name: Point the version at the images tested for this commit
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="sha-${GITHUB_SHA::7}"
          version="${GITHUB_REF_NAME}"
          for image in "$repo" "$repo-external"; do
            for _ in $(seq 1 60); do
              docker buildx imagetools inspect "$image:$sha" > /dev/null 2>&1 && break
              echo "Waiting for $image:$sha (built and tested by the branch push of this commit)..."
              sleep 30
            done
            docker buildx imagetools inspect "$image:$sha" > /dev/null || { echo "No tested image $image:$sha: push the commit to a branch first" >&2; exit 1; }
            docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$image:$sha"
            echo "$image:$version -> $image:$sha"
          done

  real-download:
    name: with-server image with the real game server download (manual, never published)
    if: github.event_name == 'workflow_dispatch' && inputs.real_download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the with-server target (SteamCMD, anonymous login)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: with-server
          load: true
          tags: racemgr:with-server
      - name: The downloaded server is in the image and is copied in on first start
        run: |
          docker run --rm -e RM_PATH_TO_DEDICATED_SERVER=/tmp/ams2 --entrypoint bash racemgr:with-server -c '
            set -e
            /app/seed-server.sh
            ls -la /tmp/ams2 | head -20
            test -f /tmp/ams2/DedicatedServerCmd.exe
            test -f /tmp/ams2/server.cfg
            du -sh /opt/ams2-server'
