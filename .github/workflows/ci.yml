name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Builds the web UI (lint, type check, Vitest, production build), runs the Java tests and packages the jar.
      # The Windows installer profile is skipped: it needs Windows tooling.
      - run: ./mvnw -B package -P '!windows-dist'
      # The racemgr_rotate Lua addon, on Lua 5.3 like the game server, against a stand-in for its Lua API
      - run: python3 -m venv /tmp/lua-venv && /tmp/lua-venv/bin/pip install -q lupa && /tmp/lua-venv/bin/python docker/ci/racemgr-rotate-test.py && /tmp/lua-venv/bin/python docker/ci/ams2-stats-test.py
      - uses: actions/upload-artifact@v7
        with:
          name: racemgr-jar
          path: target/racemgr-*.jar
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: racemgr-jar
          path: target
      # The suite starts a throwaway MongoDB with Docker, the jar, a stand-in game server and the runner's Chrome
      - run: npm ci
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e/artifacts
          if-no-files-found: ignore
